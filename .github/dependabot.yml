# Dependabot のバージョン更新設定
# 設定オプションの一覧:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # アプリの依存（npm）。CI で自動検証できるため daily で回す
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      # マイナー・パッチ更新はまとめて1つのPRにする
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions（.github/workflows/*）。actions/checkout・setup-node 等を追随
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # アクション更新はまとめて1つのPRにする
      actions:
        patterns:
          - "*"

  # docker-compose.yml のイメージ（postgres 等）。メジャー更新もPRを立て手動トリアージする
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
