name: CI

# PR と main への push で lint・build・test（カバレッジ計測込み）を自動実行する（技術改善計画 T-01）。
# Dependabot の依存更新 PR もここで検証される。マージ（＝本番デプロイ）は手動のまま。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN を最小権限に絞る（CodeQL: actions/missing-workflow-permissions・技術改善計画 T-24）。
# 既定は読み取りのみとし、書き込みが要るジョブだけが個別に足す。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # カバレッジ表を PR コメントとして投稿・更新するため（T-38）
      pull-requests: write

    # 統合テスト用 Postgres。docker-compose の db-test と同条件（DB=hitosuji_test）。
    # 5433 で公開し TEST_DATABASE_URL の既定（localhost:5433）に合わせる。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hitosuji
          POSTGRES_PASSWORD: hitosuji
          POSTGRES_DB: hitosuji_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hitosuji -d hitosuji_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 統合テストの接続先。マイグレーションは vitest の globalSetup が自動適用する。
      TEST_DATABASE_URL: postgresql://hitosuji:hitosuji@localhost:5433/hitosuji_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vercel 本番の既定ランタイムに合わせる
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # npm test と同じテストを走らせつつカバレッジも採る（T-38）。
      # --no-file-parallelism による直列化で数秒増えるだけなので、CI では常に計測側を回す
      - run: npm run test:coverage

      # 以降はカバレッジの可視化（FB-49 / T-38）。テストが落ちた場合はここへ来ない
      - name: カバレッジ表を生成する
        # --silent は npm のバナー（"> hitosuji@0.1.0 ..."）が markdown に混ざるのを防ぐ
        run: npm run --silent coverage:summary > coverage/summary.md

      - name: ジョブサマリへ出力する
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: PR へコメントする
        if: github.event_name == 'pull_request'
        # Dependabot の PR は GITHUB_TOKEN が読み取り専用に降格するため投稿が 403 になる。
        # カバレッジの可視化で CI を赤くしたくないので失敗は許容する（ジョブサマリ側には出る）
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const body = require("node:fs").readFileSync("coverage/summary.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // 実行ごとにコメントが増えないよう、目印を持つ既存コメントがあれば更新する
            const marker = "<!-- coverage-summary -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.user?.type === "Bot" && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
