name: CI

# PR と main への push で lint・build・test（カバレッジ計測込み）を自動実行する（技術改善計画 T-01）。
# Dependabot の依存更新 PR もここで検証される。マージ（＝本番デプロイ）は手動のまま。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN を最小権限に絞る（CodeQL: actions/missing-workflow-permissions・技術改善計画 T-24）。
# 既定は読み取りのみとし、書き込みが要るジョブだけが個別に足す。
permissions:
  contents: read

jobs:
  # docs の機械検査（T-86）。npm も DB も要らないので verify とは別ジョブにして並列で回す。
  # チェックアウトは既定の浅いクローンのままでよい（更新日の警告は履歴が要るぶんだけ自動で飛ぶ）
  docs:
    runs-on: ubuntu-latest

    # permissions はトップレベルの contents: read のまま（verify のように書き込みを足さないので再掲しない）

    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/docs-check.sh

  # ブラウザテスト段（テスト戦略定義書 §3 / T-03）。Chromium バイナリを要する唯一の段なので
  # verify とは別ジョブにして並列で回す（verify の所要に足さない。T-118）。DB もサーバも要らない。
  # 実行タイムゾーンは JST 固定——この段の本番はオーナーの端末だけで、UTC で回す意味がない
  # （Node 段が UTC・ブラウザ段が JST という §9 の分担そのもの）
  browser:
    runs-on: ubuntu-latest

    # permissions はトップレベルの contents: read のまま（docs ジョブと同じ）

    env:
      TZ: Asia/Tokyo

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # ブラウザ本体と、ランナーに無い共有ライブラリを入れる（テストが要るのは chromium だけ）
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  verify:
    runs-on: ubuntu-latest

    # ジョブ側の指定はトップレベルとマージされず置換なので contents: read も再掲する
    permissions:
      contents: read
      # カバレッジ表を PR コメントとして投稿・更新するため（T-38）。npm ci/build/test と
      # 同じジョブのトークンに乗るが、投稿だけ別ジョブに切るとアーティファクト受け渡しが
      # 増える。単独オーナーの public リポジトリで fork PR は read に降格するため許容する
      pull-requests: write

    # 統合テスト用 Postgres。docker-compose の db-test と同条件（DB=hitosuji_test）。
    # 5433 で公開し TEST_DATABASE_URL の既定（localhost:5433）に合わせる。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hitosuji
          POSTGRES_PASSWORD: hitosuji
          POSTGRES_DB: hitosuji_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hitosuji -d hitosuji_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 統合テストの接続先。マイグレーションは vitest の globalSetup が自動適用する。
      TEST_DATABASE_URL: postgresql://hitosuji:hitosuji@localhost:5433/hitosuji_test
      # ジョブ全体の基準は本番の Node 実行環境（Vercel）と同じ UTC（T-62）。ubuntu ランナーの
      # 既定も UTC だが、既定に頼ると将来変わったときに黙って条件が動く。JST 側は下の
      # 2本目のテスト実行が受け持つ
      TZ: UTC

    steps:
      - uses: actions/checkout@v7
        with:
          # 変更箇所カバレッジ（T-38）が base...HEAD の差分を取るため全履歴が要る
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Vercel 本番の既定ランタイムに合わせる
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # テストファイルの型を見るのはここだけ（T-69。理由はテスト戦略定義書 §9）。
      # build より速く落ちるので lint の直後に置く
      - run: npm run typecheck
      - run: npm run build
      # npm test と同じテストを走らせつつカバレッジも採る（T-38）。
      # --no-file-parallelism による直列化で数秒増えるだけなので、CI では常に計測側を回す
      - run: npm run test:coverage
      # 本番はブラウザ側が JST で走るので、そちらの実行タイムゾーンでも通す（テスト戦略定義書
      # §9 / T-62）。実行範囲は上と同じ全段——TZ だけを変えた2本目で、段では分けない
      - name: 実行タイムゾーンが JST でもテストを回す
        env:
          TZ: Asia/Tokyo
        run: npm test

      # 以降はカバレッジの可視化（FB-49 / T-38）。テストが落ちた場合はここへ来ない
      - name: カバレッジ表を生成する
        env:
          # PR のときだけ変更箇所カバレッジを添える（push には「変更箇所」の基準がないので空になる）
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # --silent は npm のバナー（"> hitosuji@0.1.0 ..."）が markdown に混ざるのを防ぐ
        run: npm run --silent coverage:summary -- "$BASE_SHA" > coverage/summary.md

      - name: ジョブサマリへ出力する
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: PR へコメントする
        if: github.event_name == 'pull_request'
        # Dependabot の PR は GITHUB_TOKEN が読み取り専用に降格するため投稿が 403 になる。
        # カバレッジの可視化で CI を赤くしたくないので失敗は許容する（ジョブサマリ側には出る）
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const body = require("node:fs").readFileSync("coverage/summary.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // 実行ごとにコメントが増えないよう、目印を持つ既存コメントがあれば更新する。
            // 目印は本文の1行目（scripts/coverage-summary.sh が出す HTML コメント）を
            // そのまま使う——ここに文字列を書き写すと片方だけ変えたときに静かに壊れる
            const marker = body.split("\n")[0];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
